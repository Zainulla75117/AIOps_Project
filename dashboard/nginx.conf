server {
    listen 80;

    # Serve the static React files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the Python backend
    # Note: 'kubernetes-agent' should be the hostname or IP of your backend container
    location /api/ {
        proxy_pass http://kubernetes-agent:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /admin requests to the Python backend
    location /admin/ {
        proxy_pass http://kubernetes-agent:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
