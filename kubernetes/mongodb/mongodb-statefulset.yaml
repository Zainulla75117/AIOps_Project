apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: aiops-system
  labels:
    app.kubernetes.io/name: mongodb
spec:
  serviceName: "mongodb-headless"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-100-207.ap-south-1.compute.internal
      containers:
        - name: mongodb
          image: mongo:8.0.4
          ports:
            - containerPort: 27017
              name: mongodb
          envFrom:
            - secretRef:
                name: mongodb-secrets-aiops
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: hostpath-mongodb
        resources:
          requests:
            storage: 2Gi
