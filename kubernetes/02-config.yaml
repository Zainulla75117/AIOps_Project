apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-agent-config
  namespace: aiops-system
data:
  AIOPS_K8S_IN_CLUSTER: "true"
  AIOPS_SCAN_INTERVAL_SECONDS: "60"
  AIOPS_RESTART_THRESHOLD: "5"
  AIOPS_PENDING_THRESHOLD_SECONDS: "300"
  AIOPS_LOG_TAIL_LINES: "500"
  AIOPS_GEMINI_MODEL: "gemini-2.5-flash"
  AIOPS_SANITIZE_LOGS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-agent-secrets
  namespace: aiops-system
type: Opaque
stringData:
  # IMPORTANT: Replace this with your actual Gemini API Key before applying,
  # or use an external secret management system like ExternalSecrets or SealedSecrets.
  AIOPS_GEMINI_API_KEY: "replace-me-with-gemini-key"
