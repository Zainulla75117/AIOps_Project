apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-agent-config
  namespace: aiops-system
data:
   AIOPS_K8S_IN_CLUSTER : "true" 
   AIOPS_GEMINI_MODEL : "gemini-3.7-flash" 
   AIOPS_API_PORT : "8000" 
   AIOPS_MONGO_HOST : "mongodb-service.aiops-system.svc.cluster.local" 
   AIOPS_MONGO_DB_NAME : "aiops_agent" 
   AIOPS_AWS_REGION : "us-east-1"  
   AWS_DEFAULT_REGION : "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-agent-secrets
  namespace: aiops-system
type: Opaque
stringData:
  AIOPS_GEMINI_API_KEY : "your-gemini-api-key" 
  AIOPS_ADMIN_PASSWORD_HASH : "your-admin-password-hash"
  AIOPS_JWT_SECRET : "your-jwt-secret"
  AWS_ACCESS_KEY_ID : "your-aws-access-key-id"
  AWS_SECRET_ACCESS_KEY : "your-aws-secret-access-key"
  AIOPS_MONGO_USER : "admin"
  AIOPS_MONGO_PASSWORD : "your-mongodb-password"
  AIOPS_MONGO_URI : "mongodb://admin:your-mongodb-password@mongodb-service.aiops-system.svc.cluster.local:27017/aiops_agent?authSource=admin"
