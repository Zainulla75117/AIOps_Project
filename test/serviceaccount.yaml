
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-log-reader
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-log-reader
  namespace: default
rules:
  # Read pods
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  # Read pod logs
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-log-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: app-log-reader
    namespace: default
roleRef:
  kind: Role
  name: app-log-reader
  apiGroup: rbac.authorization.k8s.io